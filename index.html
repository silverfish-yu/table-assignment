<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能手机对比作业</title>
    <style>
        table {
            border-collapse: collapse;
            width: 50%;
            margin: 20px 0;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
    <h2>智能手机数据对比</h2>
    <table>
        <caption>2023年热门智能手机参数及价格对比</caption>
    
        <thead>
            <tr>
                <th colspan="3">智能手机基本信息与对比</th>
            </tr>
            <tr>
                <th>手机型号</th>
                <th>价格 (美元)</th>
                <th>电池续航 (小时)</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Phone A (高配版)</td>
                <td>999</td>
                <td>12</td>
            </tr>
            <tr>
                <td>Phone B (性价比款)</td>
                <td>599</td>
                <td>15</td>
            </tr>
            <tr>
                <td>Phone C (入门款)</td>
                <td>299</td>
                <td>18</td>
            </tr>
        </tbody>
    </table>
    <h3>基于表格数据的结论</h3>
    <ul>
        <li>Phone C 拥有最长的电池续航（18小时），并且价格最便宜。</li>
        <li>Phone A 是这三款手机中最昂贵的，但它的电池续航却是最短的。</li>
        <li>Phone B 在价格和电池续航之间提供了一个相对平衡的选择。</li>
    </ul>
</body>
</html>
